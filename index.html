<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Forgery Land Cadastre & Verification | Abiti Mama Shibiru</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #1e40af;
            --accent: #f59e0b;
            --danger: #b91c1c;
            --success: #16a34a;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-light); color: var(--text-dark); overflow: hidden; }

        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1002;
            flex-wrap: wrap;
            gap: 8px;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand i { font-size: 1.3rem; color: var(--accent); }
        .brand h1 { font-size: 0.92rem; font-weight: 700; letter-spacing: 0.5px; }

        .header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .city-select, .lang-select {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }
        .city-select option, .lang-select option { color: black; }

        .toolbar {
            background: white;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #cbd5e1;
            z-index: 1001;
        }
        .search-container {
            flex: 1;
            min-width: 180px;
            display: flex;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
        }
        .search-container input {
            flex: 1;
            border: none;
            padding: 8px 12px;
            background: transparent;
            outline: none;
            font-size: 0.85rem;
        }
        .search-container button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 14px;
            cursor: pointer;
        }

        .tools-grid { display: flex; gap: 5px; flex-wrap: wrap; }
        .tool-btn {
            background: #f1f5f9;
            color: var(--text-dark);
            border: 1px solid #cbd5e1;
            padding: 6px 9px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: #e2e8f0; }
        .tool-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tool-btn.secure-lock { background: #fef2f2; color: var(--danger); border-color: #fca5a5; }
        .tool-btn.secure-lock.unlocked { background: #f0fdf4; color: var(--success); border-color: #bbf7d0; }
        .tool-btn.danger { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }

        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
        #map { flex: 1; height: 100%; z-index: 1; }

        .drawer {
            width: 390px;
            max-width: 90vw;
            background: white;
            border-left: 1px solid #cbd5e1;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
        }
        .drawer.open { display: flex; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
        .drawer-header h3 { font-size: 0.95rem; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b; }

        .security-badge {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .security-badge.unlocked {
            background: #f0fdf4;
            border-color: #bbf7d0;
            color: #166534;
        }

        .anti-fake-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .anti-fake-box h4 { font-size: 0.82rem; color: #1e40af; margin-bottom: 6px; display: flex; align-items: center; gap: 5px; }
        .verify-input-group { display: flex; gap: 6px; }
        .verify-input-group input { flex: 1; padding: 6px 8px; border: 1px solid #93c5fd; border-radius: 4px; font-size: 0.82rem; }
        .verify-input-group button { background: #2563eb; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        #verificationResult { margin-top: 6px; font-size: 0.78rem; font-weight: 600; }

        .gov-warning {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #b45309;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.74rem;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.88rem;
        }
        .save-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }
        .save-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .parcel-list { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .parcel-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid var(--success);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.82rem;
        }
        .parcel-card h4 { color: var(--primary); margin-bottom: 3px; }
        .parcel-actions { display: flex; gap: 8px; margin-top: 6px; }
        .parcel-actions button { padding: 3px 8px; font-size: 0.75rem; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer; background: white; }

        .status-bar {
            background: #0f172a;
            color: #e2e8f0;
            padding: 8px 14px;
            font-size: 0.78rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 1002;
        }
        .status-bar span b { color: #38bdf8; }
        .share-link-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .developer-tag { font-size: 0.68rem; color: #94a3b8; text-align: center; background: #1e293b; padding: 3px; }
    </style>
</head>
<body>
    <!-- App UI & Script hordofsiisuun qindaa'era -->
</body>
</html>
