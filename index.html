<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio-EduVerify Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }
        h2 { color: #1b365d; text-align: center; margin-top: 0; font-size: 22px; }
        p.subtitle { color: #666; font-size: 13px; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #333; font-size: 13px; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus { border-color: #1b365d; }
        button {
            width: 100%;
            padding: 14px;
            background: #1b365d;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #12233f; }
        
        #resultBox {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }
        .valid { background: #e6f4ea; border: 1px solid #34a853; color: #137333; }
        .invalid { background: #fce8e6; border: 1px solid #ea4335; color: #c5221f; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🛡️ Ethio-EduVerify Pro</h2>
        <p class="subtitle">Mirkaneessa Ragaa Barnoota Yuunversitii (Original vs Fake Checker)</p>
        
        <form id="verifyForm">
            <div class="form-group">
                <label>Maqaa Guutuu (Full Name):</label>
                <input type="text" id="fullName" placeholder="Fkn: Abiti Mama" required>
            </div>
            
            <div class="form-group">
                <label>Lakkoofsa Galmee / ID (Student ID):</label>
                <input type="text" id="studentId" placeholder="Fkn: bhr/1024/15" required>
            </div>

            <div class="form-group">
                <label>Yuunversitii / Instituutii:</label>
                <select id="university">
                    <option value="Bule Hora University">Yuunversitii Bulee Horaa</option>
                    <option value="Addis Ababa University">Yuunversitii Finfinnee</option>
                    <option value="Jimma University">Yuunversitii Jimmaa</option>
                </select>
            </div>

            <button type="submit" id="checkBtn">🔍 Ragaa Mirkaneessi (Verify)</button>
        </form>

        <div id="resultBox"></div>
    </div>

    <script>
        // --- TELEGRAM BOT CONFIGURATION ---
        const BOT_TOKEN = "GARTI_BOT_TOKEN_KEE_AS_ITTI_GALCHI"; 
        const CHAT_ID = "CHAT_ID_KEE_AS_ITTI_GALCHI";         

        // Database fakee qorannoo (Test data)
        const officialDatabase = [
            { name: "abiti mama", id: "bhr/1024/15", uni: "Bule Hora University" },
            { name: "nafiyad shifera", id: "aau/4512/14", uni: "Addis Ababa University" }
        ];

        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('fullName').value.trim().toLowerCase();
            const idInput = document.getElementById('studentId').value.trim().toLowerCase();
            const uniInput = document.getElementById('university').value;
            const resultBox = document.getElementById('resultBox');
            const checkBtn = document.getElementById('checkBtn');

            checkBtn.disabled = true;
            checkBtn.textContent = "⏳ Sakatta'aa jira...";

            setTimeout(() => {
                const found = officialDatabase.find(student => 
                    student.id === idInput && student.uni === uniInput
                );

                resultBox.style.display = 'block';
                let verificationStatus = "";

                if (found) {
                    resultBox.className = "valid";
                    resultBox.innerHTML = `
                        <strong>✅ RAGAA DHUGAA (ORIGINAL CERTIFICATE)</strong><br>
                        • <b>Maqaa:</b> ${document.getElementById('fullName').value}<br>
                        • <b>ID:</b> ${document.getElementById('studentId').value}<br>
                        • <b>Yuunversitii:</b> ${uniInput}<br>
                        <i style="color: #137333; margin-top: 5px; display:block;">Status: Systemii galmee keessatti argameera!</i>
                    `;
                    verificationStatus = "ORIGINAL (DHUGAA)";
                } else {
                    resultBox.className = "invalid";
                    resultBox.innerHTML = `
                        <strong>❌ RAGAA SOBAA (FAKE / INVALID)</strong><br>
                        • Maqaan ykn ID kun Galmee Yuunversitii kanaa keessatti hin jiru!<br>
                        <i style="color: #c5221f; margin-top: 5px; display:block;">Akeekkachiisa: Ragaan kun galmee sirrii irraa hin argamne.</i>
                    `;
                    verificationStatus = "SOBAA (FAKE)";
                }

                sendReportToTelegram(document.getElementById('fullName').value, idInput, uniInput, verificationStatus);

                checkBtn.disabled = false;
                checkBtn.textContent = "🔍 Ragaa Mirkaneessi (Verify)";
            }, 1000);
        });

        function sendReportToTelegram(name, id, uni, status) {
            if (BOT_TOKEN.includes("GARTI_BOT_TOKEN")) return;

            const text = `🔍 <b>VERIFICATION AUDIT REPORT</b>\n\n` +
                         `👤 <b>Maqaa:</b> ${name}\n` +
                         `🆔 <b>ID:</b> ${id}\n` +
                         `🏛️ <b>Yuunversitii:</b> ${uni}\n` +
                         `📊 <b>Bu'aa:</b> <b>${status}</b>`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
            }).catch(err => console.log(err));
        }
    </script>
</body>
</html>
