
<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Map Pro - Smart GIS & Digital Cadastre | Abiti Mama Shibiru</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Routing Machine CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #0a4d3c;
            --secondary: #137a63;
            --accent: #f39c12;
            --bg-light: #f4f7f6;
            --text-dark: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: var(--bg-light); color: var(--text-dark); overflow: hidden; }

        /* Top Navigation Bar */
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            z-index: 1002;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand i { font-size: 1.4rem; color: var(--accent); }
        .brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
        .brand span { font-size: 0.7rem; background: rgba(255,255,255,0.2); padding: 2px 6px; border-radius: 4px; display: block; margin-top: 2px; }

        .lang-select {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }
        .lang-select option { color: black; }

        /* Toolbar & Search */
        .toolbar {
            background: white;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid #cbd5e1;
            z-index: 1001;
        }
        .search-container {
            flex: 1;
            min-width: 220px;
            display: flex;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
        }
        .search-container input {
            flex: 1;
            border: none;
            padding: 8px 12px;
            background: transparent;
            outline: none;
            font-size: 0.9rem;
        }
        .search-container button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 14px;
            cursor: pointer;
        }

        .tools-grid { display: flex; gap: 6px; flex-wrap: wrap; }
        .tool-btn {
            background: #f1f5f9;
            color: var(--text-dark);
            border: 1px solid #cbd5e1;
            padding: 7px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: #e2e8f0; }
        .tool-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tool-btn.danger { color: #dc2626; border-color: #fca5a5; background: #fef2f2; }
        .tool-btn.danger:hover { background: #dc2626; color: white; }

        /* Main Workspace */
        .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
        #map { flex: 1; height: 100%; z-index: 1; }

        /* Side Drawer (Cadastre & Saved Parcels) */
        .drawer {
            width: 350px;
            max-width: 90vw;
            background: white;
            border-left: 1px solid #cbd5e1;
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding: 15px;
        }
        .drawer.open { display: flex; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; }
        .drawer-header h3 { font-size: 1rem; color: var(--primary); }
        .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #475569; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.88rem;
        }
        .save-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }
        .parcel-list { margin-top: 15px; display: flex; flex-direction: column; gap: 8px; }
        .parcel-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 4px solid var(--secondary);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.82rem;
        }
        .parcel-card h4 { color: var(--primary); margin-bottom: 3px; }
        .parcel-actions { display: flex; gap: 8px; margin-top: 6px; }
        .parcel-actions button { padding: 3px 8px; font-size: 0.75rem; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer; background: white; }

        /* Bottom Status Bar */
        .status-bar {
            background: #0f172a;
            color: #e2e8f0;
            padding: 8px 14px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            z-index: 1002;
        }
        .status-bar span b { color: #38bdf8; }
        .share-link-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.78rem;
            cursor: pointer;
        }
        .developer-tag { font-size: 0.7rem; color: #94a3b8; text-align: center; background: #1e293b; padding: 3px; }

        .leaflet-routing-container { max-height: 200px; overflow-y: auto; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fas fa-map-marked-alt"></i>
            <div>
                <h1>E-Map Pro <span id="appBadge">Smart GIS & Cadastre</span></h1>
            </div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="om">Afaan Oromoo</option>
            <option value="am">አማርኛ</option>
            <option value="en">English</option>
        </select>
    </header>

    <div class="toolbar">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Bakka barbaadi (fkn: Bule Hora)..." onkeypress="if(event.key==='Enter') searchLocation()">
            <button onclick="searchLocation()"><i class="fas fa-search"></i></button>
        </div>
        <div class="tools-grid">
            <button class="tool-btn" onclick="locateUser()" id="btnLocate"><i class="fas fa-crosshairs"></i> <span>Bakka Koo</span></button>
            <button class="tool-btn" onclick="toggleRouting()" id="btnRoute"><i class="fas fa-route"></i> <span>Daandii</span></button>
            <button class="tool-btn" onclick="toggleMeasure()" id="btnMeasure"><i class="fas fa-draw-polygon"></i> <span>Safara</span></button>
            <button class="tool-btn" onclick="cycleLayer()" id="btnLayer"><i class="fas fa-layer-group"></i> <span>Kaartaa</span></button>
            <button class="tool-btn" onclick="toggleDrawer()" id="btnCadastre"><i class="fas fa-folder-open"></i> <span>Kaadaastara</span></button>
            <button class="tool-btn danger" onclick="clearMap()"><i class="fas fa-trash-alt"></i></button>
        </div>
    </div>

    <div class="workspace">
        <div id="map"></div>

        <!-- Digital Cadastre & Land Registry Drawer -->
        <div class="drawer" id="cadastreDrawer">
            <div class="drawer-header">
                <h3 id="drawerTitle"><i class="fas fa-landmark"></i> Galmee Kaadaastaraa (UPIN)</h3>
                <button class="close-btn" onclick="toggleDrawer()">&times;</button>
            </div>
            
            <div class="form-group">
                <label id="lblOwner">Maqaa Abbaa Qabeenyaa / Dhaabbataa</label>
                <input type="text" id="ownerName" placeholder="Fkn: Abiti Mama...">
            </div>
            <div class="form-group">
                <label id="lblUpin">Lakkoofsa Addaa Lafaa (UPIN)</label>
                <input type="text" id="parcelUpin" placeholder="Fkn: BH-01-4589">
            </div>
            <div class="form-group">
                <label id="lblUse">Gosa Tajaajila Lafaa</label>
                <select id="landUse">
                    <option value="Mana Jireenyaa (Residential)">Mana Jireenyaa (Residential)</option>
                    <option value="Daldala (Commercial)">Daldala (Commercial)</option>
                    <option value="Tajaajila Hawaasaa / Barnoota">Tajaajila Hawaasaa / Barnoota</option>
                    <option value="Qonnaa fi Buna (Agriculture)">Qonnaa fi Buna (Agriculture)</option>
                </select>
            </div>
            <div class="form-group">
                <label id="lblAreaInput">Bal'ina Lafaa (m²)</label>
                <input type="text" id="parcelAreaInput" readonly placeholder="Kaartaa irratti safaraa...">
            </div>
            <button class="save-btn" onclick="saveParcel()" id="btnSaveParcel"><i class="fas fa-save"></i> Ragaa Olkaa'i</button>

            <div class="parcel-list" id="parcelList"></div>
        </div>
    </div>

    <div class="status-bar">
        <div>GPS: <b id="coordsDisplay">5.63330, 38.23330</b></div>
        <div id="areaDisplayBox" style="display:none;">Bal'ina: <b id="areaDisplay">0 m²</b></div>
        <div id="statusText">Kaartaa irratti tuquun fayyadami.</div>
        <button class="share-link-btn" onclick="shareLocation()"><i class="fas fa-share-alt"></i> Qoodi</button>
    </div>
    <div class="developer-tag">
        Developed & Owned by <b>Abiti Mama Shibiru</b> | E-Map Pro GIS System
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
        const i18n = {
            om: {
                searchPlaceholder: "Bakka barbaadi (fkn: Bule Hora)...",
                locate: "Bakka Koo",
                route: "Daandii",
                measure: "Safara",
                layer: "Kaartaa",
                cadastre: "Kaadaastara",
                drawerTitle: "Galmee Kaadaastaraa (UPIN)",
                owner: "Maqaa Abbaa Qabeenyaa",
                upin: "Lakkoofsa Addaa Lafaa (UPIN)",
                use: "Gosa Tajaajila Lafaa",
                area: "Bal'ina Lafaa (m²)",
                save: "Ragaa Olkaa'i",
                ready: "Kaartaa irratti tuquun fayyadami.",
                measureHint: "Gooleewwan lafaa kaartaa irratti tuqi..."
            },
            am: {
                searchPlaceholder: "ቦታ ይፈልጉ (ምሳሌ: Bule Hora)...",
                locate: "ያለሁበት",
                route: "መንገድ",
                measure: "መለኪያ",
                layer: "ካርታ",
                cadastre: "ካዳስተር",
                drawerTitle: "የመሬት ካዳስተር መዝገብ",
                owner: "የባለቤት ስም",
                upin: "የመሬት መለያ ቁጥር (UPIN)",
                use: "የመሬት አጠቃቀም",
                area: "ስፋት (ካሬ ሜትር)",
                save: "መዝግብ",
                ready: "ካርታው ላይ ይንኩ።",
                measureHint: "የመሬቱን ማዕዘኖች ካርታው ላይ ይንኩ..."
            },
            en: {
                searchPlaceholder: "Search place...",
                locate: "My Loc",
                route: "Route",
                measure: "Measure",
                layer: "Layer",
                cadastre: "Cadastre",
                drawerTitle: "Digital Cadastre Registry",
                owner: "Owner Name",
                upin: "Unique Parcel ID (UPIN)",
                use: "Land Use",
                area: "Area (m²)",
                save: "Save",
                ready: "Tap on the map to inspect.",
                measureHint: "Tap parcel corners on the map..."
            }
        };

        let currentLang = 'om';
        const defaultCenter = [5.6333, 38.2333]; // Bule Hora
        let selectedCoords = defaultCenter;

        const map = L.map('map').setView(defaultCenter, 14);

        const layers = [
            { name: "Street", layer: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }) },
            { name: "Satellite", layer: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri Satellite' }) },
            { name: "Terrain", layer: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap' }) }
        ];
        let currentLayerIdx = 0;
        layers[0].layer.addTo(map);

        const landmarks = [
            { name: "Yuunivarsiitii Bulee Horaa (BHU)", coords: [5.6542, 38.2415], desc: "Dhaabbata Barnoota Olaanaa" },
            { name: "Hospitaala Waliigalaa Bulee Horaa", coords: [5.6295, 38.2310], desc: "Tajaajila Fayyaa" },
            { name: "Bulchiinsa Magaalaa Bulee Horaa", coords: [5.6333, 38.2333], desc: "Waajjira Mootummaa" }
        ];
        landmarks.forEach(l => {
            L.marker(l.coords).addTo(map).bindPopup(`<b>${l.name}</b><br>${l.desc}`);
        });

        let mode = 'inspect';
        let measurePoints = [];
        let measurePolygon = null;
        let measureMarkers = [];
        let routePoints = [];
        let routingControl = null;
        let activeMarker = null;
        let savedParcels = JSON.parse(localStorage.getItem('emap_parcels') || '[]');

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const t = i18n[currentLang];
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.querySelector('#btnLocate span').innerText = t.locate;
            document.querySelector('#btnRoute span').innerText = t.route;
            document.querySelector('#btnMeasure span').innerText = t.measure;
            document.querySelector('#btnLayer span').innerText = t.layer;
            document.querySelector('#btnCadastre span').innerText = t.cadastre;
            document.getElementById('drawerTitle').innerHTML = `<i class="fas fa-landmark"></i> ${t.drawerTitle}`;
            document.getElementById('lblOwner').innerText = t.owner;
            document.getElementById('lblUpin').innerText = t.upin;
            document.getElementById('lblUse').innerText = t.use;
            document.getElementById('lblAreaInput').innerText = t.area;
            document.getElementById('btnSaveParcel').innerHTML = `<i class="fas fa-save"></i> ${t.save}`;
            document.getElementById('statusText').innerText = t.ready;
        }

        function cycleLayer() {
            map.removeLayer(layers[currentLayerIdx].layer);
            currentLayerIdx = (currentLayerIdx + 1) % layers.length;
            layers[currentLayerIdx].layer.addTo(map);
        }

        function locateUser() { map.locate({ setView: true, maxZoom: 17 }); }
        map.on('locationfound', e => {
            selectedCoords = [e.latlng.lat, e.latlng.lng];
            if (activeMarker) map.removeLayer(activeMarker);
            activeMarker = L.marker(e.latlng).addTo(map).bindPopup("<b>Bakka Jirtu (Abiti Mama E-Map)</b>").openPopup();
            updateCoordsUI(e.latlng.lat, e.latlng.lng);
        });

        function setMode(newMode) {
            document.getElementById('btnMeasure').classList.remove('active');
            document.getElementById('btnRoute').classList.remove('active');
            if (mode === newMode) {
                mode = 'inspect';
            } else {
                mode = newMode;
                if (mode === 'measure') {
                    document.getElementById('btnMeasure').classList.add('active');
                    document.getElementById('areaDisplayBox').style.display = 'block';
                    document.getElementById('statusText').innerText = i18n[currentLang].measureHint;
                } else if (mode === 'route') {
                    document.getElementById('btnRoute').classList.add('active');
                    routePoints = [];
                }
            }
        }
        function toggleMeasure() { setMode('measure'); }
        function toggleRouting() { setMode('route'); }
        function toggleDrawer() {
            document.getElementById('cadastreDrawer').classList.toggle('open');
            renderParcels();
        }

        map.on('click', e => {
            selectedCoords = [e.latlng.lat, e.latlng.lng];
            updateCoordsUI(e.latlng.lat, e.latlng.lng);

            if (mode === 'measure') {
                measurePoints.push(e.latlng);
                const m = L.circleMarker(e.latlng, { radius: 5, color: '#dc2626', fillOpacity: 1 }).addTo(map);
                measureMarkers.push(m);

                if (measurePolygon) map.removeLayer(measurePolygon);
                if (measurePoints.length >= 3) {
                    measurePolygon = L.polygon(measurePoints, { color: '#0a4d3c', fillOpacity: 0.35 }).addTo(map);
                    const area = computeSphericalArea(measurePoints);
                    const areaStr = `${area.toFixed(2)} m² (${(area/10000).toFixed(4)} ha)`;
                    document.getElementById('areaDisplay').innerText = areaStr;
                    document.getElementById('parcelAreaInput').value = areaStr;
                }
            } else if (mode === 'route') {
                routePoints.push(e.latlng);
                L.circleMarker(e.latlng, { radius: 6, color: '#2563eb' }).addTo(map);
                if (routePoints.length === 2) {
                    if (routingControl) map.removeControl(routingControl);
                    routingControl = L.Routing.control({
                        waypoints: [L.latLng(routePoints[0]), L.latLng(routePoints[1])],
                        routeWhileDragging: true
                    }).addTo(map);
                    routePoints = [];
                }
            } else {
                if (activeMarker) map.removeLayer(activeMarker);
                activeMarker = L.marker(e.latlng).addTo(map)
                    .bindPopup(`<b>Pin (Abiti Mama)</b><br>Lat: ${e.latlng.lat.toFixed(5)}<br>Lng: ${e.latlng.lng.toFixed(5)}`).openPopup();
            }
        });

        function updateCoordsUI(lat, lng) {
            document.getElementById('coordsDisplay').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        }

        function computeSphericalArea(latLngs) {
            const R = 6378137;
            let area = 0;
            for (let i = 0; i < latLngs.length; i++) {
                const p1 = latLngs[i];
                const p2 = latLngs[(i + 1) % latLngs.length];
                area += ((p2.lng - p1.lng) * Math.PI / 180) *
                        (2 + Math.sin(p1.lat * Math.PI / 180) + Math.sin(p2.lat * Math.PI / 180));
            }
            return Math.abs(area * R * R / 2.0);
        }

        function saveParcel() {
            const owner = document.getElementById('ownerName').value.trim();
            const upin = document.getElementById('parcelUpin').value.trim();
            const use = document.getElementById('landUse').value;
            const area = document.getElementById('parcelAreaInput').value || "Point";

            if (!owner || !upin) { alert("Maqaa fi UPIN guuti!"); return; }

            const record = {
                id: Date.now(),
                owner,
                upin,
                use,
                area,
                coords: measurePoints.length >= 3 ? measurePoints.map(p => [p.lat, p.lng]) : [selectedCoords],
                date: new Date().toLocaleDateString()
            };

            savedParcels.unshift(record);
            localStorage.setItem('emap_parcels', JSON.stringify(savedParcels));
            document.getElementById('ownerName').value = '';
            document.getElementById('parcelUpin').value = '';
            renderParcels();
        }

        function renderParcels() {
            const list = document.getElementById('parcelList');
            list.innerHTML = '';
            savedParcels.forEach(p => {
                const card = document.createElement('div');
                card.className = 'parcel-card';
                card.innerHTML = `
                    <h4>${p.upin} - ${p.owner}</h4>
                    <div>${p.use} | <b>${p.area}</b></div>
                    <div style="color:#64748b; font-size:0.75rem;">Date: ${p.date}</div>
                    <div class="parcel-actions">
                        <button onclick="viewParcel(${p.id})"><i class="fas fa-eye"></i> Ilaali</button>
                        <button onclick="exportParcel(${p.id})"><i class="fas fa-download"></i> GeoJSON</button>
                        <button onclick="deleteParcel(${p.id})" style="color:red;"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function viewParcel(id) {
            const p = savedParcels.find(item => item.id === id);
            if (!p) return;
            clearMap();
            if (p.coords.length >= 3) {
                measurePolygon = L.polygon(p.coords, { color: '#f39c12', fillOpacity: 0.4 }).addTo(map)
                    .bindPopup(`<b>UPIN: ${p.upin}</b><br>Abbaa: ${p.owner}<br>Bal'ina: ${p.area}`).openPopup();
                map.fitBounds(measurePolygon.getBounds());
            } else {
                activeMarker = L.marker(p.coords[0]).addTo(map)
                    .bindPopup(`<b>UPIN: ${p.upin}</b><br>Abbaa: ${p.owner}`).openPopup();
                map.setView(p.coords[0], 17);
            }
        }

        function exportParcel(id) {
            const p = savedParcels.find(item => item.id === id);
            if (!p) return;
            const geojson = {
                type: "Feature",
                properties: { upin: p.upin, owner: p.owner, landUse: p.use, area: p.area, developer: "Abiti Mama Shibiru" },
                geometry: {
                    type: p.coords.length >= 3 ? "Polygon" : "Point",
                    coordinates: p.coords.length >= 3 ? [p.coords.map(c => [c[1], c[0]])] : [p.coords[0][1], p.coords[0][0]]
                }
            };
            const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Parcel_${p.upin}.geojson`;
            a.click();
        }

        function deleteParcel(id) {
            savedParcels = savedParcels.filter(item => item.id !== id);
            localStorage.setItem('emap_parcels', JSON.stringify(savedParcels));
            renderParcels();
        }

        async function searchLocation() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ' Ethiopia')}`);
                const data = await res.json();
                if (data.length > 0) {
                    const latlng = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                    selectedCoords = latlng;
                    map.setView(latlng, 16);
                    if (activeMarker) map.removeLayer(activeMarker);
                    activeMarker = L.marker(latlng).addTo(map).bindPopup(`<b>${data[0].display_name}</b>`).openPopup();
                    updateCoordsUI(latlng[0], latlng[1]);
                }
            } catch (e) { console.error(e); }
        }

        function shareLocation() {
            const link = `https://www.google.com/maps?q=${selectedCoords[0]},${selectedCoords[1]}`;
            if (navigator.share) {
                navigator.share({ title: 'E-Map by Abiti Mama', url: link });
            } else {
                navigator.clipboard.writeText(link);
                alert("Liinkiin bakka kanaa garagalfameera:\n" + link);
            }
        }

        function clearMap() {
            measurePoints = [];
            routePoints = [];
            if (measurePolygon) map.removeLayer(measurePolygon);
            measureMarkers.forEach(m => map.removeLayer(m));
            measureMarkers = [];
            if (activeMarker) map.removeLayer(activeMarker);
            if (routingControl) { map.removeControl(routingControl); routingControl = null; }
            document.getElementById('areaDisplayBox').style.display = 'none';
            document.getElementById('parcelAreaInput').value = '';
            mode = 'inspect';
            document.getElementById('btnMeasure').classList.remove('active');
            document.getElementById('btnRoute').classList.remove('active');
        }
    </script>
</body>
</html>
